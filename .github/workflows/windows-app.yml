name: Windows aplikácia

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      # Digitálny podpis sa zapne sám, keď sú v Settings -> Secrets nastavené
      # údaje pre Azure Trusted Signing (návod v README).
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python balíky
        run: pip install -r requirements.txt pyinstaller pytest pypdf

      - name: Tesseract OCR (+ čeština)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { $src = "C:\Program Files (x86)\Tesseract-OCR" }
          New-Item -ItemType Directory -Force tesseract | Out-Null
          Copy-Item "$src\*" tesseract -Recurse
          # rovnaké jazykové modely, na ktorých bolo čítanie odladené
          Remove-Item tesseract\tessdata\*.traineddata -Exclude osd.traineddata
          foreach ($l in "ces", "eng") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata" -OutFile "tesseract\tessdata\$l.traineddata"
          }
          # nepotrebné súbory (dokumentácia, nástroje na trénovanie)
          Remove-Item tesseract\doc -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem tesseract -Filter *.exe | Where-Object { $_.Name -notin "tesseract.exe" } | Remove-Item
          .\tesseract\tesseract.exe --list-langs

      - name: Testy
        run: |
          python -m pytest -q
          python -c "from kompletacia.ocr import check_tesseract as c; e = c(); assert e is None, e; print('OCR OK')"

      - name: Údaje o verzii
        shell: pwsh
        run: |
          $n = ($env:APP_VERSION -replace '\.', ', ') + ', 0'
          (Get-Content assets\version_info.txt -Encoding utf8) -replace 'VERZIA_CISLA', $n -replace 'VERZIA', $env:APP_VERSION |
            Set-Content version_info.txt -Encoding utf8

      - name: Zostavenie .exe
        run: >
          pyinstaller --noconfirm --windowed --name KompletacnyList
          --icon assets/icon.ico
          --version-file version_info.txt
          --add-data "kompletacia/fonts;kompletacia/fonts"
          --add-data "assets;assets"
          KompletacnyList.py

      - name: Digitálny podpis aplikácie
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
        run: |
          Install-Module -Name TrustedSigning -Force -Scope CurrentUser -Repository PSGallery
          foreach ($f in "dist\KompletacnyList\KompletacnyList.exe", "tesseract\tesseract.exe") {
            Invoke-TrustedSigning -Endpoint $env:SIGNING_ENDPOINT `
              -CodeSigningAccountName $env:SIGNING_ACCOUNT -CertificateProfileName $env:SIGNING_PROFILE `
              -Files (Resolve-Path $f).Path -FileDigest SHA256 `
              -TimestampRfc3161 "http://timestamp.acs.microsoft.com" -TimestampDigest SHA256
          }

      - name: Balík ZIP
        shell: pwsh
        run: |
          Copy-Item tesseract dist\KompletacnyList\tesseract -Recurse
          Copy-Item README.md dist\KompletacnyList\
          Compress-Archive dist\KompletacnyList KompletacnyList-Windows.zip

      - name: Skúška zabaleného .exe na Windows
        shell: pwsh
        run: |
          $p = Start-Process dist\KompletacnyList\KompletacnyList.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Inštalátor
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Digitálny podpis inštalátora
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
        run: |
          Invoke-TrustedSigning -Endpoint $env:SIGNING_ENDPOINT `
            -CodeSigningAccountName $env:SIGNING_ACCOUNT -CertificateProfileName $env:SIGNING_PROFILE `
            -Files (Resolve-Path installer\KompletacnyList-Instalator.exe).Path -FileDigest SHA256 `
            -TimestampRfc3161 "http://timestamp.acs.microsoft.com" -TimestampDigest SHA256

      - name: Bez podpisu
        if: env.SIGNING_ENABLED != 'true'
        run: echo "::notice::Aplikácia nie je digitálne podpísaná - chýbajú údaje v Settings -> Secrets (pozri README)."

      - uses: actions/upload-artifact@v4
        with:
          name: KompletacnyList-Instalator
          path: installer/KompletacnyList-Instalator.exe

      - uses: actions/upload-artifact@v4
        with:
          name: KompletacnyList-Windows
          path: dist/KompletacnyList

      - name: Vydanie (len pri tagu v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/KompletacnyList-Instalator.exe
            KompletacnyList-Windows.zip
